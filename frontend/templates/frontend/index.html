<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Villana</title>
    {% load static %}
    <style>
        * { margin: 0; padding: 0; }
        body, html, #root {
            width: 100%;
            height: 100%;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        console.log("Villana app starting...");
        // Afficher un message pendant le chargement
        document.getElementById('root').innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#6C63FF;font-size:24px;">⏳ Chargement de Villana...</div>';
    </script>
    <script src="{% static 'frontend/bundle.web.js' %}"></script>
    <script>
        console.log("Bundle loaded.");
    </script>
</body>
</html>
